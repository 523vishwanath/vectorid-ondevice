<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161227"/>
      <stop offset="1" stop-color="#0E0B18"/>
    </linearGradient>
    <linearGradient id="detGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2150"/>
      <stop offset="1" stop-color="#241d40"/>
    </linearGradient>
    <marker id="aVio" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aCoral" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" rx="20" fill="url(#bg)"/>

  <text x="40" y="52" fill="#ECEAF4" font-size="24" font-weight="700">VectorID — on-device pipeline</text>
  <text x="40" y="78" fill="#9089AC" font-size="14">Detect, then classify — with a zoomed retry — all in the phone browser, offline</text>
  <line x1="40" y1="96" x2="920" y2="96" stroke="#2B2444" stroke-width="1"/>

  <!-- TOP ROW happy path, y center 168 -->
  <rect x="40" y="132" width="176" height="72" rx="14" fill="#1E1836" stroke="#3A2F5C" stroke-width="1.5"/>
  <text x="128" y="164" fill="#ECEAF4" font-size="16" font-weight="600" text-anchor="middle">Photo</text>
  <text x="128" y="186" fill="#A9A2C4" font-size="12" text-anchor="middle">camera or upload</text>

  <line x1="216" y1="168" x2="300" y2="168" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#aVio)"/>

  <rect x="300" y="126" width="232" height="84" rx="14" fill="url(#detGrad)" stroke="#7C3AED" stroke-width="1.75"/>
  <text x="416" y="152" fill="#8B5CF6" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PASS 1 · DETECT</text>
  <text x="416" y="176" fill="#EDE9FE" font-size="16" font-weight="700" text-anchor="middle">YOLOv8n</text>
  <text x="416" y="196" fill="#B9B2D6" font-size="12" text-anchor="middle">full image · conf &#8805; 0.50</text>

  <text x="608" y="150" fill="#5EEAD4" font-size="12.5" font-weight="600" text-anchor="middle">found &#10003;</text>
  <line x1="532" y1="168" x2="684" y2="168" stroke="#5EEAD4" stroke-width="2.5" marker-end="url(#aTeal)"/>

  <rect x="684" y="126" width="236" height="84" rx="14" fill="url(#detGrad)" stroke="#7C3AED" stroke-width="1.75"/>
  <text x="802" y="152" fill="#8B5CF6" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CLASSIFY</text>
  <text x="802" y="176" fill="#EDE9FE" font-size="16" font-weight="700" text-anchor="middle">EfficientViT</text>
  <text x="802" y="196" fill="#B9B2D6" font-size="12" text-anchor="middle">species + probabilities</text>

  <!-- not found down to pass 2 -->
  <path d="M416 210 L416 250" fill="none" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#aVio)"/>
  <rect x="356" y="221" width="120" height="22" rx="11" fill="#1a1530"/>
  <text x="416" y="237" fill="#C4B5FD" font-size="12" font-weight="600" text-anchor="middle">not found</text>

  <!-- MIDDLE ROW retry, y center 293 -->
  <rect x="300" y="250" width="232" height="86" rx="14" fill="url(#detGrad)" stroke="#7C3AED" stroke-width="1.75"/>
  <text x="416" y="276" fill="#8B5CF6" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PASS 2 · ZOOM + RETRY</text>
  <text x="416" y="300" fill="#EDE9FE" font-size="15" font-weight="700" text-anchor="middle">YOLOv8n on center 65%</text>
  <text x="416" y="320" fill="#B9B2D6" font-size="12" text-anchor="middle">zoomed view · conf &#8805; 0.50</text>

  <!-- pass2 found routes up right side into classify -->
  <path d="M532 276 L610 276 L610 212" fill="none" stroke="#5EEAD4" stroke-width="2.5" marker-end="url(#aTeal)"/>
  <rect x="558" y="264" width="92" height="22" rx="11" fill="#132a22"/>
  <text x="604" y="280" fill="#5EEAD4" font-size="12" font-weight="600" text-anchor="middle">found &#10003;</text>

  <!-- pass2 not found down to retake -->
  <path d="M416 336 L416 384" fill="none" stroke="#FB7185" stroke-width="2.5" marker-end="url(#aCoral)"/>
  <rect x="326" y="356" width="180" height="22" rx="11" fill="#2a1420"/>
  <text x="416" y="372" fill="#FB7185" font-size="12" font-weight="600" text-anchor="middle">still nothing after 2 tries</text>

  <!-- retake -->
  <rect x="300" y="384" width="232" height="72" rx="14" fill="#2a1420" stroke="#FB7185" stroke-width="1.75"/>
  <text x="416" y="416" fill="#FB7185" font-size="16" font-weight="700" text-anchor="middle">&#9873; Re-take the photo</text>
  <text x="416" y="438" fill="#D9A2AC" font-size="12" text-anchor="middle">never classified — no false species</text>

  <!-- RIGHT outcomes -->
  <path d="M802 210 L802 240" fill="none" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#aVio)"/>
  <text x="802" y="262" fill="#9089AC" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CLASSIFIER OUTCOME</text>

  <rect x="684" y="278" width="236" height="70" rx="14" fill="#132a22" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="802" y="306" fill="#5EEAD4" font-size="15" font-weight="700" text-anchor="middle">Confident species</text>
  <text x="802" y="328" fill="#A9C7BE" font-size="12" text-anchor="middle">clear top-1 · auto-logged to survey</text>

  <line x1="802" y1="348" x2="802" y2="362" stroke="#A78BFA" stroke-width="2" marker-end="url(#aVio)"/>

  <rect x="684" y="362" width="236" height="94" rx="14" fill="#2a1420" stroke="#FB7185" stroke-width="1.5"/>
  <text x="802" y="390" fill="#FB7185" font-size="15" font-weight="700" text-anchor="middle">&#9873; Flag for expert review</text>
  <text x="802" y="412" fill="#D9A2AC" font-size="12" text-anchor="middle">top-1 minus top-2 &#8804; 40 points</text>
  <text x="802" y="430" fill="#D9A2AC" font-size="12" text-anchor="middle">or low overall confidence</text>
  <text x="802" y="448" fill="#8E8299" font-size="11" text-anchor="middle">the two Anopheles near-tie lands here</text>

  <!-- footer -->
  <rect x="40" y="486" width="880" height="98" rx="14" fill="#14111f" stroke="#2B2444" stroke-width="1"/>
  <circle cx="66" cy="512" r="4" fill="#7C3AED"/>
  <text x="82" y="517" fill="#C4B5FD" font-size="14" font-weight="700">Why two passes, then stop</text>
  <text x="60" y="543" fill="#A9A2C4" font-size="13">The detector gates the classifier — nothing is identified unless a mosquito is actually found. The center-65% zoom gives a</text>
  <text x="60" y="563" fill="#A9A2C4" font-size="13">missed specimen a second, larger look. If it still isn't found, the app asks for a new photo rather than inventing a species,</text>
  <text x="60" y="583" fill="#A9A2C4" font-size="13">because the classifier has no "not a mosquito" class.</text>
</svg>
