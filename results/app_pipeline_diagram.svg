<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161227"/>
      <stop offset="1" stop-color="#0E0B18"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5EEAD4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" rx="18" fill="url(#bg)"/>
  <text x="34" y="44" fill="#ECEAF4" font-size="22" font-weight="700">VectorID — on-device pipeline</text>
  <text x="34" y="68" fill="#7E7699" font-size="13">Detect → (zoom retry) → classify, all in the phone browser · offline</text>

  <!-- Photo -->
  <rect x="34" y="96" width="180" height="60" rx="12" fill="#1E1836" stroke="#3A2F5C"/>
  <text x="124" y="124" fill="#ECEAF4" font-size="15" font-weight="600" text-anchor="middle">Photo</text>
  <text x="124" y="143" fill="#A9A2C4" font-size="11.5" text-anchor="middle">camera or upload</text>

  <!-- Detect pass 1 -->
  <rect x="270" y="90" width="210" height="72" rx="12" fill="#241d40" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="375" y="118" fill="#C4B5FD" font-size="15" font-weight="700" text-anchor="middle">YOLOv8n · detect</text>
  <text x="375" y="138" fill="#A9A2C4" font-size="11.5" text-anchor="middle">full image · conf ≥ 0.50</text>
  <text x="375" y="153" fill="#7E7699" font-size="10.5" text-anchor="middle">pass 1</text>

  <line x1="214" y1="126" x2="270" y2="126" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision 1 -->
  <text x="540" y="112" fill="#5EEAD4" font-size="12" font-weight="600" text-anchor="middle">found?</text>
  <line x1="480" y1="126" x2="560" y2="126" stroke="#5EEAD4" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="520" y="120" fill="#5EEAD4" font-size="11" text-anchor="middle">yes</text>

  <!-- Classify (top right) -->
  <rect x="600" y="90" width="230" height="72" rx="12" fill="#241d40" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="715" y="118" fill="#C4B5FD" font-size="15" font-weight="700" text-anchor="middle">EfficientViT · classify</text>
  <text x="715" y="138" fill="#A9A2C4" font-size="11.5" text-anchor="middle">on the detected crop</text>
  <text x="715" y="153" fill="#7E7699" font-size="10.5" text-anchor="middle">species + probabilities</text>

  <!-- pass1 no -> pass 2 -->
  <text x="375" y="196" fill="#7E7699" font-size="11" text-anchor="middle">no</text>
  <line x1="375" y1="162" x2="375" y2="214" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Detect pass 2 -->
  <rect x="240" y="214" width="270" height="80" rx="12" fill="#241d40" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="375" y="242" fill="#C4B5FD" font-size="15" font-weight="700" text-anchor="middle">YOLOv8n · detect (zoom)</text>
  <text x="375" y="262" fill="#A9A2C4" font-size="11.5" text-anchor="middle">center 65% crop · conf ≥ 0.50</text>
  <text x="375" y="279" fill="#7E7699" font-size="10.5" text-anchor="middle">pass 2 — zoomed second chance</text>

  <!-- pass2 found yes -> classify (curve up-right) -->
  <path d="M510 244 C 580 244, 640 210, 690 168" fill="none" stroke="#5EEAD4" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="600" y="228" fill="#5EEAD4" font-size="11" text-anchor="middle">found → classify</text>

  <!-- pass2 no -> retake -->
  <line x1="375" y1="294" x2="375" y2="340" stroke="#FB7185" stroke-width="2" marker-end="url(#arrowCoral)"/>
  <text x="398" y="320" fill="#FB7185" font-size="11" text-anchor="middle">no</text>

  <!-- Retake -->
  <rect x="250" y="340" width="250" height="64" rx="12" fill="#241a04" stroke="#FBBF5C" stroke-width="1.5"/>
  <text x="375" y="366" fill="#FBBF5C" font-size="14" font-weight="700" text-anchor="middle">⚑ Re-take the photo</text>
  <text x="375" y="386" fill="#A9A2C4" font-size="11" text-anchor="middle">no mosquito after 2 tries · never classified</text>

  <!-- Classifier outcomes -->
  <text x="715" y="200" fill="#7E7699" font-size="12" font-weight="600" text-anchor="middle">classifier outcome</text>

  <!-- confident -->
  <rect x="600" y="220" width="230" height="66" rx="12" fill="#152b22" stroke="#5EEAD4" stroke-width="1.3"/>
  <text x="715" y="246" fill="#5EEAD4" font-size="13.5" font-weight="700" text-anchor="middle">Confident species</text>
  <text x="715" y="266" fill="#A9A2C4" font-size="11" text-anchor="middle">clear top-1 · logged to survey</text>

  <!-- flag -->
  <rect x="600" y="300" width="230" height="86" rx="12" fill="#2a1420" stroke="#FB7185" stroke-width="1.3"/>
  <text x="715" y="326" fill="#FB7185" font-size="13.5" font-weight="700" text-anchor="middle">⚑ Flag for expert review</text>
  <text x="715" y="347" fill="#A9A2C4" font-size="11" text-anchor="middle">top-1 minus top-2 ≤ 40 points</text>
  <text x="715" y="363" fill="#A9A2C4" font-size="11" text-anchor="middle">(or low confidence)</text>
  <text x="715" y="379" fill="#7E7699" font-size="10" text-anchor="middle">the two Anopheles near-tie lands here</text>

  <line x1="715" y1="162" x2="715" y2="220" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="286" x2="715" y2="300" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer band -->
  <rect x="34" y="446" width="796" height="82" rx="12" fill="#12101f" stroke="#2B2444"/>
  <text x="50" y="474" fill="#C4B5FD" font-size="13" font-weight="700">Why two passes then stop</text>
  <text x="50" y="497" fill="#A9A2C4" font-size="11.5">The detector gates the classifier: nothing is identified unless a mosquito is actually found. The center-65% zoom</text>
  <text x="50" y="514" fill="#A9A2C4" font-size="11.5">gives a missed specimen a second, larger look; if it still isn't found, the app asks for a new photo rather than inventing a species.</text>
</svg>
