<svg viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>VectorCam system architecture from capture to prediction</title>
<desc>Three phases. Build (offline, once): clean and split data, U2Net segment, train EfficientViT. Field use (on the phone, offline): a field officer captures a photo; a YOLOv8n detector finds and crops the mosquito, retries on a zoomed center crop if the first pass misses, and asks for a re-take if both miss; the crop is classified and passed through a confidence gate. Decision: confident results auto-log, uncertain ones go to a human entomologist whose corrections feed back to training.</desc>
<defs>
  <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
    <path d="M1 1.5 L10 6 L1 10.5" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1c1a2e" flood-opacity="0.14"/>
  </filter>
  <linearGradient id="gGrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#F1EFE8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAFBF4"/><stop offset="1" stop-color="#DDF3EC"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F2FE"/><stop offset="1" stop-color="#E9E7FC"/></linearGradient>
  <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDF4E2"/><stop offset="1" stop-color="#F9EAD2"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCECEA"/><stop offset="1" stop-color="#F9E0DB"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE9EC"/><stop offset="1" stop-color="#F7DCE0"/></linearGradient>
</defs>

<rect x="0" y="0" width="760" height="720" fill="#FAF9F5"/>
<text x="40" y="40" fill="#2C2C2A" font-size="20" font-weight="700">VectorID — system architecture</text>
<text x="40" y="62" fill="#7A7871" font-size="13">From capture to a logged species — showing what runs on the phone and where a person steps in</text>

<!-- ============ BUILD PHASE ============ -->
<rect x="40" y="86" width="680" height="118" rx="14" fill="#ffffff" stroke="#E4E1D6" stroke-width="1.2"/>
<rect x="40" y="86" width="6" height="118" rx="3" fill="#9A968C"/>
<rect x="60" y="76" width="168" height="24" rx="12" fill="#EFEDE4" stroke="#D9D6CB" stroke-width="0.8"/>
<text x="74" y="92" fill="#5F5E5A" font-size="12" font-weight="700">BUILD · offline, once</text>

<rect x="72" y="120" width="176" height="58" rx="10" fill="url(#gGrey)" stroke="#B9B6AC" stroke-width="1" filter="url(#sh)"/>
<text x="160" y="145" text-anchor="middle" fill="#2C2C2A" font-size="14" font-weight="600">Clean + split data</text>
<text x="160" y="163" text-anchor="middle" fill="#6E6C64" font-size="11.5">grouped by specimen</text>

<rect x="292" y="120" width="176" height="58" rx="10" fill="url(#gTeal)" stroke="#5FBDA3" stroke-width="1" filter="url(#sh)"/>
<text x="380" y="145" text-anchor="middle" fill="#0A5A47" font-size="14" font-weight="600">U2Net segment</text>
<text x="380" y="163" text-anchor="middle" fill="#0F6E56" font-size="11.5">remove tray + ID label</text>

<rect x="512" y="120" width="176" height="58" rx="10" fill="url(#gViolet)" stroke="#8A80D8" stroke-width="1" filter="url(#sh)"/>
<text x="600" y="145" text-anchor="middle" fill="#3C3489" font-size="14" font-weight="600">Train + evaluate</text>
<text x="600" y="163" text-anchor="middle" fill="#534AB7" font-size="11.5">EfficientViT-B0</text>

<line x1="248" y1="149" x2="288" y2="149" stroke="#9A968C" stroke-width="2" marker-end="url(#ar)"/>
<line x1="468" y1="149" x2="508" y2="149" stroke="#9A968C" stroke-width="2" marker-end="url(#ar)"/>

<!-- deployed models handoff -->
<path d="M600 178 L600 232" fill="none" stroke="#9E99C9" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<rect x="548" y="196" width="104" height="20" rx="10" fill="#EEEBFB"/>
<text x="600" y="210" text-anchor="middle" fill="#534AB7" font-size="11" font-weight="600">deployed models</text>

<!-- ============ FIELD USE PHASE ============ -->
<rect x="40" y="232" width="680" height="228" rx="14" fill="#ffffff" stroke="#CFE7DE" stroke-width="1.2"/>
<rect x="40" y="232" width="6" height="228" rx="3" fill="#0F6E56"/>
<rect x="60" y="222" width="220" height="24" rx="12" fill="#E1F3EC" stroke="#BCE0D3" stroke-width="0.8"/>
<text x="74" y="238" fill="#0A5A47" font-size="12" font-weight="700">FIELD USE · on the phone, offline</text>

<!-- top lane: capture -> detect1 -> classify -> gate  (y center 300) -->
<rect x="64" y="272" width="150" height="60" rx="10" fill="url(#gCoral)" stroke="#CE7A5E" stroke-width="1" filter="url(#sh)"/>
<text x="139" y="290" text-anchor="middle" fill="#8A3A1C" font-size="11" font-weight="600">Field officer</text>
<text x="139" y="308" text-anchor="middle" fill="#712B13" font-size="13.5" font-weight="700">Capture photo</text>
<text x="139" y="323" text-anchor="middle" fill="#9A5236" font-size="11">person + phone</text>

<rect x="252" y="272" width="164" height="60" rx="10" fill="url(#gTeal)" stroke="#5FBDA3" stroke-width="1.1" filter="url(#sh)"/>
<text x="334" y="289" text-anchor="middle" fill="#0F6E56" font-size="10.5" font-weight="700" letter-spacing="0.5">PASS 1 · DETECT</text>
<text x="334" y="307" text-anchor="middle" fill="#0A5A47" font-size="13.5" font-weight="700">YOLOv8n</text>
<text x="334" y="323" text-anchor="middle" fill="#0F6E56" font-size="11">full image · conf &#8805; 0.50</text>

<rect x="454" y="272" width="140" height="60" rx="10" fill="url(#gViolet)" stroke="#8A80D8" stroke-width="1.1" filter="url(#sh)"/>
<text x="524" y="298" text-anchor="middle" fill="#3C3489" font-size="13.5" font-weight="700">Classify</text>
<text x="524" y="316" text-anchor="middle" fill="#534AB7" font-size="11">ONNX · ~6 ms</text>

<rect x="626" y="272" width="72" height="60" rx="10" fill="url(#gAmber)" stroke="#D3A24E" stroke-width="1.1" filter="url(#sh)"/>
<text x="662" y="298" text-anchor="middle" fill="#633806" font-size="12.5" font-weight="700">Confidence</text>
<text x="662" y="315" text-anchor="middle" fill="#8A5A12" font-size="11">gate</text>

<line x1="214" y1="302" x2="248" y2="302" stroke="#9A968C" stroke-width="2" marker-end="url(#ar)"/>
<line x1="416" y1="302" x2="450" y2="302" stroke="#0F6E56" stroke-width="2" marker-end="url(#ar)"/>
<text x="433" y="293" text-anchor="middle" fill="#0F6E56" font-size="10.5" font-weight="600">found</text>
<line x1="594" y1="302" x2="622" y2="302" stroke="#9A968C" stroke-width="2" marker-end="url(#ar)"/>

<!-- detect1 miss -> detect2 (zoom) -->
<path d="M334 332 L334 366" fill="none" stroke="#9A968C" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="340" width="88" height="19" rx="9.5" fill="#F1EFE8"/>
<text x="334" y="354" text-anchor="middle" fill="#8A3A1C" font-size="10.5" font-weight="600">not found</text>

<rect x="240" y="366" width="188" height="58" rx="10" fill="url(#gTeal)" stroke="#5FBDA3" stroke-width="1.1" filter="url(#sh)"/>
<text x="334" y="386" text-anchor="middle" fill="#0F6E56" font-size="10.5" font-weight="700" letter-spacing="0.5">PASS 2 · ZOOM + RETRY</text>
<text x="334" y="404" text-anchor="middle" fill="#0A5A47" font-size="13" font-weight="700">detect on center 65%</text>
<text x="334" y="418" text-anchor="middle" fill="#0F6E56" font-size="10.5">zoomed view · conf &#8805; 0.50</text>

<!-- detect2 found -> classify (route up the right side of pass2, clear of boxes) -->
<path d="M428 388 L512 388 L512 334" fill="none" stroke="#0F6E56" stroke-width="2" marker-end="url(#ar)"/>
<rect x="446" y="378" width="84" height="19" rx="9.5" fill="#E1F3EC"/>
<text x="488" y="392" text-anchor="middle" fill="#0F6E56" font-size="10.5" font-weight="600">found &#8594; classify</text>

<!-- detect2 miss -> retake -->
<path d="M240 395 L150 395 L150 424" fill="none" stroke="#B23A48" stroke-width="2" marker-end="url(#ar)"/>
<rect x="120" y="386" width="70" height="19" rx="9.5" fill="#FBE9EC"/>
<text x="155" y="400" text-anchor="middle" fill="#B23A48" font-size="10.5" font-weight="600">miss again</text>

<rect x="72" y="424" width="156" height="26" rx="8" fill="url(#gRed)" stroke="#C9515F" stroke-width="1.1"/>
<text x="150" y="441" text-anchor="middle" fill="#8E2733" font-size="12.5" font-weight="700">&#9873; Re-take the photo</text>

<!-- ============ DECISION PHASE ============ -->
<rect x="40" y="488" width="680" height="196" rx="14" fill="#ffffff" stroke="#EAD6CF" stroke-width="1.2"/>
<rect x="40" y="488" width="6" height="196" rx="3" fill="#993C1D"/>
<rect x="60" y="478" width="270" height="24" rx="12" fill="#F7E7E0" stroke="#E5C9BD" stroke-width="0.8"/>
<text x="74" y="494" fill="#8A3A1C" font-size="12" font-weight="700">DECISION · where a person enters the loop</text>

<rect x="96" y="524" width="248" height="66" rx="10" fill="url(#gTeal)" stroke="#5FBDA3" stroke-width="1.1" filter="url(#sh)"/>
<text x="220" y="550" text-anchor="middle" fill="#0A5A47" font-size="14" font-weight="700">Confident &#8594; auto-log</text>
<text x="220" y="569" text-anchor="middle" fill="#0F6E56" font-size="11.5">species recorded to survey,</text>
<text x="220" y="583" text-anchor="middle" fill="#0F6E56" font-size="11.5">no person needed</text>

<rect x="416" y="524" width="248" height="66" rx="10" fill="url(#gCoral)" stroke="#CE7A5E" stroke-width="1.1" filter="url(#sh)"/>
<text x="540" y="550" text-anchor="middle" fill="#712B13" font-size="14" font-weight="700">Uncertain &#8594; expert review</text>
<text x="540" y="569" text-anchor="middle" fill="#9A5236" font-size="11.5">top-1 minus top-2 &#8804; 40 points</text>
<text x="540" y="583" text-anchor="middle" fill="#9A5236" font-size="11.5">entomologist confirms · human in loop</text>

<!-- gate splits to the two decisions -->
<path d="M655 332 L655 508 L220 508 L220 522" fill="none" stroke="#9A968C" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="176" y="498" width="88" height="19" rx="9.5" fill="#E1F3EC"/>
<text x="220" y="512" text-anchor="middle" fill="#0F6E56" font-size="10.5" font-weight="600">confident</text>

<path d="M675 332 L675 508 L540 508 L540 522" fill="none" stroke="#9A968C" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="496" y="498" width="88" height="19" rx="9.5" fill="#F7E7E0"/>
<text x="540" y="512" text-anchor="middle" fill="#8A3A1C" font-size="10.5" font-weight="600">uncertain</text>

<!-- corrections feed back -->
<rect x="416" y="612" width="248" height="30" rx="8" fill="url(#gViolet)" stroke="#8A80D8" stroke-width="1"/>
<text x="540" y="631" text-anchor="middle" fill="#3C3489" font-size="11.5" font-weight="600">corrections feed back to training</text>
<path d="M540 612 L540 592" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ar)"/>

<text x="40" y="706" fill="#9A968C" font-size="11">All detection and classification run in the phone browser via ONNX Runtime Web — no server, works offline.</text>
</svg>
