<svg width="100%" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
<title>VectorCam system architecture from capture to prediction</title>
<desc>A field officer photographs a specimen on a phone. On the phone a YOLOv8n detector locates and crops the mosquito; if the first pass finds nothing it retries on a zoomed center crop, and if both passes fail the app asks for a re-take. A detected crop is classified and passed through a confidence gate. Confident results are logged automatically; uncertain results go to a human expert whose corrections feed back to training.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.t{font-size:14px;font-weight:600}.ts{font-size:11.5px}.h{font-size:14px;font-weight:600}</style>
<rect x="0" y="0" width="680" height="640" fill="#ffffff"/>

<!-- BUILD PHASE -->
<text class="h" x="40" y="26" fill="#444441">Build phase — offline, one time</text>
<rect x="40" y="38" width="600" height="96" rx="12" fill="none" stroke="#888780" stroke-width="0.6" stroke-dasharray="4 4"/>
<rect x="58" y="64" width="150" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="133" y="86" text-anchor="middle" fill="#2C2C2A">Clean + split data</text><text class="ts" x="133" y="103" text-anchor="middle" fill="#5F5E5A">grouped by specimen</text>
<rect x="262" y="64" width="150" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="337" y="86" text-anchor="middle" fill="#085041">U2Net segment</text><text class="ts" x="337" y="103" text-anchor="middle" fill="#0F6E56">remove tray + ID label</text>
<rect x="466" y="64" width="156" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="544" y="86" text-anchor="middle" fill="#3C3489">Train + evaluate</text><text class="ts" x="544" y="103" text-anchor="middle" fill="#534AB7">EfficientViT-B0</text>
<line x1="208" y1="90" x2="260" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="412" y1="90" x2="464" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- FIELD USE PHASE -->
<text class="h" x="40" y="172" fill="#085041">Field use — on the phone, fully offline</text>
<rect x="40" y="184" width="600" height="180" rx="12" fill="none" stroke="#0F6E56" stroke-width="0.6" stroke-dasharray="4 4"/>

<!-- capture -->
<rect x="56" y="214" width="120" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="ts" x="116" y="231" text-anchor="middle" fill="#993C1D">Field officer</text><text class="t" x="116" y="249" text-anchor="middle" fill="#712B13">Capture photo</text><text class="ts" x="116" y="266" text-anchor="middle" fill="#993C1D">person + phone</text>

<!-- detect pass 1 -->
<rect x="200" y="214" width="140" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="270" y="236" text-anchor="middle" fill="#085041">YOLOv8n detect</text><text class="ts" x="270" y="253" text-anchor="middle" fill="#0F6E56">full image · conf ≥ 0.50</text><text class="ts" x="270" y="268" text-anchor="middle" fill="#5F5E5A">pass 1</text>

<!-- classify -->
<rect x="364" y="214" width="126" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="427" y="243" text-anchor="middle" fill="#3C3489">Classify</text><text class="ts" x="427" y="260" text-anchor="middle" fill="#534AB7">ONNX · ~6ms</text>

<!-- confidence gate -->
<rect x="514" y="214" width="108" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="568" y="243" text-anchor="middle" fill="#633806">Confidence</text><text class="ts" x="568" y="260" text-anchor="middle" fill="#633806">gate</text>

<line x1="176" y1="247" x2="198" y2="247" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="247" x2="362" y2="247" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="240" text-anchor="middle" fill="#0F6E56">found</text>
<line x1="490" y1="247" x2="512" y2="247" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- zoom retry (pass 2) below detect -->
<rect x="200" y="300" width="140" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="270" y="320" text-anchor="middle" fill="#085041">Zoom + retry</text><text class="ts" x="270" y="336" text-anchor="middle" fill="#0F6E56">center 65% · conf ≥ 0.50 · pass 2</text>
<path d="M255 280 L255 300" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="ts" x="228" y="295" text-anchor="middle" fill="#993C1D">miss</text>
<path d="M300 300 L322 300 L322 282" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="ts" x="333" y="296" text-anchor="start" fill="#0F6E56">found → classify</text>

<!-- retake -->
<rect x="380" y="300" width="126" height="46" rx="8" fill="#FBE9EC" stroke="#B23A48" stroke-width="0.6"/>
<text class="t" x="443" y="320" text-anchor="middle" fill="#8E2733">⚑ Re-take photo</text><text class="ts" x="443" y="336" text-anchor="middle" fill="#B23A48">both passes miss</text>
<line x1="340" y1="323" x2="378" y2="323" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="316" text-anchor="middle" fill="#993C1D">miss</text>

<!-- deployed model link -->
<line x1="544" y1="116" x2="544" y2="150" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<text class="ts" x="544" y="142" text-anchor="middle" fill="#5F5E5A">deployed models</text>

<!-- DECISION PHASE -->
<text class="h" x="40" y="406" fill="#712B13">Decision — where a person enters the loop</text>
<rect x="40" y="418" width="600" height="170" rx="12" fill="none" stroke="#993C1D" stroke-width="0.6" stroke-dasharray="4 4"/>
<rect x="80" y="460" width="220" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="190" y="481" text-anchor="middle" fill="#085041">Confident → auto-log</text><text class="ts" x="190" y="500" text-anchor="middle" fill="#0F6E56">species recorded to survey,</text><text class="ts" x="190" y="514" text-anchor="middle" fill="#0F6E56">no person needed</text>
<rect x="380" y="460" width="220" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="t" x="490" y="481" text-anchor="middle" fill="#712B13">Uncertain → expert review</text><text class="ts" x="490" y="500" text-anchor="middle" fill="#993C1D">top-1 minus top-2 ≤ 40 pts</text><text class="ts" x="490" y="514" text-anchor="middle" fill="#993C1D">entomologist confirms (human in loop)</text>
<path d="M556 280 L556 440 L190 440 L190 458" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="ts" x="300" y="433" text-anchor="middle" fill="#5F5E5A">confident</text>
<path d="M588 280 L588 440 L490 440 L490 458" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text class="ts" x="612" y="433" text-anchor="middle" fill="#5F5E5A">uncertain</text>
<rect x="380" y="536" width="220" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="490" y="556" text-anchor="middle" fill="#3C3489">corrections feed back to training</text>
<path d="M490 536 L490 528" fill="none" stroke="#534AB7" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
